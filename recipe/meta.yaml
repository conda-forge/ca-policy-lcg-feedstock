build:
  noarch: generic
  number: 0
  # DIRAC will try to update these automatically so avoid linking between environments
  no_link:
    - ${PREFIX}/etc/grid-security/certificates/*

requirements:
  build:
    # Dummpy requirement to ensure conda-forge builds this correctly
    - make

test:
  commands:
    - echo "${X509_CERT_DIR}"

